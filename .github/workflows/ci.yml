# Free checks only: no Claude calls, no QuickBooks calls, no repository secrets. Actions are pinned to the commit
# behind each release tag (the tag is in the comment).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests and secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false          # the MCP server submodule is not needed by any of these checks
          persist-credentials: false

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            .claude/skills/monthly-trend-analysis/requirements.txt
            connection/backend/requirements.txt

      - name: Install pinned dependencies (skill + backend)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .claude/skills/monthly-trend-analysis/requirements.txt -r connection/backend/requirements.txt

      - name: Skill tests (deterministic engine)
        run: python -m unittest discover -s .claude/skills/monthly-trend-analysis/tests

      - name: Golden facts still match the workbooks
        run: python evals/goldens/derive_facts.py --check

      - name: Eval-side tests (harness, P1 provenance, regression policy, submission docs)
        run: python -m unittest discover -s evals/tests

      - name: Q&A log writer tests
        run: python scripts/test_log_answer.py

      - name: Secret scanner tests
        run: python connection/scripts/test_secret_scan.py

      - name: Guard hook tests
        run: python connection/scripts/test_guard_secrets_hook.py

      - name: Backend tests (ephemeral keys, in-memory DB; never reads connection/.secrets)
        working-directory: connection/backend
        run: python manage.py test qbo --settings=config.settings_test

      - name: Secret scan (tracked and untracked, non-ignored files)
        run: python connection/scripts/secret_scan --all

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: connection/frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          persist-credentials: false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: connection/frontend/package-lock.json

      - name: Install (lockfile-exact, no install scripts)
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build (bundles submission/*.md into the Results page)
        run: npm run build
