<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · QBO Connection Console</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f5f7fa; color: #1f2933; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    form { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); width: min(90vw, 340px); }
    h1 { font-size: 1.2rem; margin: 0 0 .25rem; }
    p.note { color: #52606d; font-size: .85rem; margin: 0 0 1.25rem; }
    label { display: block; font-size: .9rem; margin: .75rem 0 .25rem; }
    input { width: 100%; padding: .5rem; border: 1px solid #cbd2d9; border-radius: 4px; box-sizing: border-box; font-size: 1rem; }
    button { margin-top: 1.25rem; width: 100%; padding: .6rem; border: 0; border-radius: 4px; background: #2563eb; color: #fff; font-size: 1rem; cursor: pointer; }
    .error { color: #b91c1c; font-size: .9rem; }
  </style>
</head>
<body>
  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    <h1>QBO Connection Console</h1>
    <p class="note">Sandbox only. Sign in with your operator account.</p>
    {% if form.errors %}<p class="error" role="alert">Username or password is incorrect.</p>{% endif %}
    <label for="id_username">Username</label>
    <input id="id_username" name="username" autocomplete="username" required autofocus>
    <label for="id_password">Password</label>
    <input id="id_password" name="password" type="password" autocomplete="current-password" required>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
